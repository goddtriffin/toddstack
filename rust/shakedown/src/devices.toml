# The one device list (design section 6). CSS pixels; `density` is the real device's, used by native harnesses:
# web renders at density 1 (pinned, so references do not depend on a display). Landscape forms are measured, not
# swapped, where the browser toolbar moves (iPhone Duo). Carried over from infra scripts/devices.
# Adding a device means a tool release; projects pick from the list by name.

[[device]]
name = "desktop"
label = "Desktop browser"
width = 1440
height = 900
density = 1
mobile = false

