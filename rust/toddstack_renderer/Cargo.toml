[package]
name = "toddstack-renderer"
# Versioned on its own, not with the workspace (webserver-base's version).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "One GPU renderer on wgpu for 2D scenes, custom instanced batches and compute kernels, with a tiny-skia CPU fallback that is also the pixel reference. Web (wasm), Apple, Android and Windows."
license-file.workspace = true
keywords = ["wgpu", "renderer", "2d", "compute", "toddstack"]
categories = ["rendering", "graphics", "wasm"]
include = ["**/*.rs", "assets/**", "web/**", "Cargo.toml", "LICENSE", "README.md"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = { workspace = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.5"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
futures-channel = "0.3.34"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }
# Exact: must equal the installed `wasm-bindgen` CLI that builds the bundle.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"

[dev-dependencies]
png = "0.18.1"
pollster = "1.0.3"
